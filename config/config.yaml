# MammoTwin central config.
# Every script/module reads paths, seed, and hyperparameters from here so
# training and inference can never silently drift apart.

project:
  name: MammoTwin
  seed: 42

paths:
  data_raw: data/raw
  data_processed: data/processed
  data_metadata: data/metadata
  data_external: data/external
  models_dir: models
  reports_dir: reports
  figures_dir: reports/figures

preprocessing:
  image_size: [224, 224]       # [height, width], final model input size
  clip_percentile: [1, 99]     # intensity clipping before normalization
  normalize_range: [0.0, 1.0]  # output pixel range after normalization
  remove_background: true      # crop to breast tissue, discard label artifacts
  background_padding: 10       # pixels of padding kept around the detected breast region

quality_checks:
  blank_std_threshold: 3.0
  low_contrast_range_fraction: 0.08
  min_breast_area_fraction: 0.03

training:
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_epochs: 30
  num_workers: 4
  early_stopping_patience: 5
  target_sensitivity: 0.90     # minimum acceptable sensitivity (recall on the
                                # positive/malignant class) for the classification
                                # operating threshold — chosen on the VALIDATION
                                # set only, via scripts/select_operating_thresholds.py.
                                # 0.5 (the previous implicit default) is NOT an
                                # appropriate cutoff for an imbalanced, safety-
                                # relevant task; missing a malignant case is far
                                # costlier than one extra case sent to review.

model:
  backbone: resnet50
  pretrained: true
  num_classes: 2               # e.g. benign / malignant
  dropout: 0.3

uncertainty:
  mc_dropout_passes: 20
  review_threshold: 0.6        # predictions below this confidence get flagged

segmentation:
  base_filters: 32             # U-Net base channel count (doubles each level)
  batch_size: 4
  learning_rate: 0.0001
  bce_weight: 0.3              # weight of BCE vs Dice in the combined loss
                                # (lowered from 0.5 -- Dice handles the severe
                                # foreground/background pixel imbalance in
                                # lesion masks better than BCE alone)

logging:
  experiments_log: reports/eval_results/experiments_log.csv